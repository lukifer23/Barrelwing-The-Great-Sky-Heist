<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Barrelwing — The Great Sky Heist</title>
    <meta name="description" content="Run the rooftops. Dodge the barrels. Ride the wind." />
    <link rel="icon" href="./assets/ui/app-icon.png" />
    <link rel="preload" href="/assets/fonts/PressStart2P.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/Silkscreen.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/assets/fonts/PressStart2P.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'Silkscreen';
        src: url('/assets/fonts/Silkscreen.woff2') format('woff2');
        font-display: block;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #070a14;
        overflow: hidden;
        font-family: 'Silkscreen', monospace;
        color: #f4e6c8;
      }
      #app {
        width: 100%; height: 100vh; height: 100dvh; position: relative;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(circle at 50% 35%, #16243d 0%, #0a0f1c 55%, #05070d 100%);
      }
      #game { line-height: 0; width: 100%; height: 100%; touch-action: none; }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 210, 130, 0.08);
      }
      [hidden] { display: none !important; }
      #touch-controls { display: none; }
      #audio-toggle { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); min-width: 86px; min-height: 44px; padding: 8px; z-index: 40; color: #f4e6c8; background: #101528dd; border: 1px solid #8194a5; border-radius: 10px; font: 11px 'Silkscreen', monospace; touch-action: manipulation; }
      body.playing #audio-toggle { top: auto; bottom: max(12px, env(safe-area-inset-bottom)); right: auto; left: 50%; transform: translateX(-50%); }
      body.playing #fps-meter { bottom: 64px; }
      #fps-meter { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); color: #9ff5ff; background: #101528; font: 12px monospace; padding: 3px 8px; z-index: 30; pointer-events: none; }
      @media (pointer: coarse) {
        #touch-controls { display: block; --control-scale: 1; --control-opacity: .75; position: absolute; inset: 0; pointer-events: none; z-index: 20; }
        #joystick, #touch-controls button { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; position: absolute; opacity: var(--control-opacity); }
        #joystick { --stick-size: calc(clamp(112px, 19vmin, 156px) * var(--control-scale)); width: var(--stick-size); height: var(--stick-size); border-radius: 50%; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); border: 2px solid #8194a5; background: #10152888; box-shadow: inset 0 0 0 12px #b7d6e014; }
        .stick-knob { position: absolute; width: 42%; height: 42%; left: 29%; top: 29%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #a0c6c9, #385b78); border: 2px solid #bfd9dc; box-shadow: 0 4px 10px #0008; will-change: transform; pointer-events: none; }
        .stick-guide { position: absolute; width: 100%; text-align: center; top: 14%; font: 10px 'Silkscreen', monospace; color: #bed0dc; pointer-events: none; }
        #joystick.held { border-color: #f0c060; }
        #touch-controls button { border: 2px solid #95b5c8; border-radius: 50%; background: #15283bdd; color: #f4e6c8; font: bold 14px 'Silkscreen', monospace; box-shadow: 0 4px 0 #070a14, inset 0 0 20px #bddbe018; }
        #touch-controls button.held { background: #8b672e; border-color: #ffe6a4; }
        #touch-controls button small { display: block; font: 7px 'Silkscreen', monospace; margin-top: 4px; }
        #touch-controls button[aria-disabled="true"] { border-color: #607585 !important; color: #a0adbb; }
        #touch-controls button[data-action="dash"]::after, #touch-controls button[data-action="attack"]::after { content: ''; position: absolute; left: 20%; bottom: 12%; width: calc(60% * var(--ready, 1)); height: 3px; background: #f0c060; border-radius: 2px; }
        .flying [data-action="dash"] { display: none; }
        [data-action="jump"] { width: calc(clamp(68px, 12vmin, 88px) * var(--control-scale)); height: calc(clamp(68px, 12vmin, 88px) * var(--control-scale)); right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); border-color: #f0c060 !important; }
        [data-action="dash"] { width: calc(clamp(54px, 9vmin, 66px) * var(--control-scale)); height: calc(clamp(54px, 9vmin, 66px) * var(--control-scale)); right: calc(max(18px, env(safe-area-inset-right)) + clamp(76px, 13vmin, 100px) * var(--control-scale)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 50px * var(--control-scale)); }
        [data-action="attack"] { display: none; }
        .brawling [data-action="attack"] { display: block; width: calc(68px * var(--control-scale)); height: calc(68px * var(--control-scale)); right: calc(max(18px, env(safe-area-inset-right)) + clamp(80px, 14vmin, 106px) * var(--control-scale)); bottom: max(18px, env(safe-area-inset-bottom)); border-color: #ffa77e !important; }
        .brawling [data-action="dash"] { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 86px * var(--control-scale)); }
        [data-action="pause"] { width: 58px; height: 34px; font-size: 10px !important; border-radius: 12px !important; right: max(12px, env(safe-area-inset-right)); top: max(68px, env(safe-area-inset-top)); }
        #touch-controls.left-handed { transform: scaleX(-1); }
        #touch-controls.left-handed button, #touch-controls.left-handed #joystick { transform: scaleX(-1); }
      }
      @media (pointer: coarse) and (orientation: portrait) {
        #app { align-items: flex-start; }
        body.playing #game { height: calc(100% - 170px); }
      }
      @media (prefers-reduced-motion: reduce) { #boot .bar span { animation: none; } }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #070a14; z-index: 50; transition: opacity .45s ease;
        letter-spacing: 1px; color: #d9b96d; font-size: 11px;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 { font-family: 'Press Start 2P'; font-size: 18px; color: #f4e6c8; margin: 0; text-shadow: 3px 3px 0 #1b1426; }
      #boot .bar { width: 220px; height: 8px; background: #1a2338; border: 2px solid #4c3a24; }
      #boot .bar span { display: block; height: 100%; width: 30%; background: linear-gradient(90deg,#e8b84b,#f7e2a0); animation: slide 1.1s infinite ease-in-out; }
      @keyframes slide { 0% { margin-left: 0; } 50% { margin-left: 70%; } 100% { margin-left: 0; } }
    </style>
  </head>
  <body>
    <div id="app"><div id="game"></div></div>
    <div id="boot"><h1>BARRELWING</h1><div class="bar"><span></span></div><div>WAKING THE WINDTAIL…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
